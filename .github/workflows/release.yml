name: Release

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    env:
      OTP_VERSION: '22.2'

    steps:
      - uses: actions/checkout@v4

      - name: Build artifact
        run: |
          docker build \
            --build-arg OTP_VERSION="${{ env.OTP_VERSION }}" \
            --tag "rabbitmq-ci:otp-${{ env.OTP_VERSION }}" \
            .
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            "rabbitmq-ci:otp-${{ env.OTP_VERSION }}" \
            bash -euo pipefail -c 'make dist'
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          mv packaging/generic-unix/*.tar.xz "packaging/generic-unix/rabbitmq-server-${VERSION}.tar.xz"

      - name: Publish to Artifactory
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: latest
        env:
          JF_URL: ${{ secrets.ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}

      - run: |
          jf rt upload \
            "packaging/generic-unix/*.tar.xz" \
            "allies-erlang/rabbitmq-server/${{ github.ref_name }}/" \
            --build-name="rabbitmq-server" \
            --build-number="${{ github.run_number }}"

          jf rt build-publish rabbitmq-server ${{ github.run_number }}
