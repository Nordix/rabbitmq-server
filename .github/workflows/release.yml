name: Release

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    env:
      OTP_VERSION: '22.2'
      base_rmq_ref: v3.8.x
      current_rmq_ref: v3.8.9-est

    steps:
      - uses: actions/checkout@v4

      - name: Build artifact
        run: |
          docker build \
            --build-arg OTP_VERSION="${{ env.OTP_VERSION }}" \
            --tag "rabbitmq-ci:otp-${{ env.OTP_VERSION }}" \
            .
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env base_rmq_ref="${{ env.base_rmq_ref }}" \
            --env current_rmq_ref="${{ env.current_rmq_ref }}" \
            "rabbitmq-ci:otp-${{ env.OTP_VERSION }}" \
            bash -euo pipefail -c 'make dist && find . -name "*.tar.xz" -print'
          TARBALL=$(find PACKAGES/ -name "*.tar.xz")
          mv "$TARBALL" "PACKAGES/rabbitmq-server-${{ github.ref_name }}.tar.xz"
          sha256sum "PACKAGES/rabbitmq-server-${{ github.ref_name }}.tar.xz" \
            > "PACKAGES/rabbitmq-server-${{ github.ref_name }}.tar.xz.sha256"

      - name: Publish to Artifactory
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: latest
        env:
          JF_URL: ${{ secrets.ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}

      - run: |
          jf rt upload \
            "PACKAGES/rabbitmq-server-${{ github.ref_name }}.*" \
            "allies-erlang/rabbitmq-server/${{ github.ref_name }}/" \
            --build-name="rabbitmq-server" \
            --build-number="${{ github.run_number }}"

          jf rt build-publish rabbitmq-server ${{ github.run_number }}
