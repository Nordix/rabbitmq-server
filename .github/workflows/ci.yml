name: CI

on:
  push:
    branches: [ '3.8.9-est' ]
  pull_request:
    branches: [ '3.8.9-est' ]

jobs:
  test:
    runs-on: ubuntu-20.04
    strategy:
      fail-fast: false
      matrix:
        otp: [ '22.2' ]
        elixir: [ '1.9.4' ]
    env:
      base_rmq_ref: v3.8.x
      current_rmq_ref: 3.8.9-est
    steps:
      - uses: actions/checkout@v3

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: check components
        run: make check-rabbitmq-components.mk current_rmq_ref=3.8.9-est

      - name: xref
        run: make xref current_rmq_ref=3.8.9-est

      - name: ct-fast
        run: make ct-fast current_rmq_ref=3.8.9-est
