name: CI

on:
  push:
    branches: [ '3.8.9-est', 'add-github-actions-ci' ]
  pull_request:
    branches: [ '3.8.9-est' ]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        otp: [ '21.3', '22.2' ]
    
    env:
      base_rmq_ref: v3.8.x
      current_rmq_ref: 3.8.9-est

    steps:
      - uses: actions/checkout@v3

      - name: Build CI image
        run: |
          docker build \
            --build-arg OTP_VERSION="${{ matrix.otp }}" \
            --tag "rabbitmq-ci:otp-${{ matrix.otp }}" \
            .

      - name: Run checks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --hostname rabbitmq-ci \
            --env base_rmq_ref \
            --env current_rmq_ref \
            "rabbitmq-ci:otp-${{ matrix.otp }}" \
            bash -euo pipefail -c '
              make fetch-deps current_rmq_ref="$current_rmq_ref"
              make current_rmq_ref="$current_rmq_ref"
              make xref current_rmq_ref="$current_rmq_ref"
              make ct CT_SUITES="unit_amqp091_content_framing unit_cluster_formation_locking_mocks unit_collections unit_config_value_encryption unit_gm unit_log_config unit_operator_policy unit_pg_local unit_plugin_directories unit_priority_queue unit_queue_consumers unit_supervisor2" current_rmq_ref="$current_rmq_ref"
            '
