name: CI

on:
  push:
    branches: [ '3.8.9-est', 'add-github-actions-ci' ]
  pull_request:
    branches: [ '3.8.9-est' ]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        otp: [ '21.3', '22.2' ]
    
    env:
      base_rmq_ref: v3.8.x
      current_rmq_ref: 3.8.9-est

    steps:
      - uses: actions/checkout@v3

      - name: Build CI image
        run: |
          docker build \
            --build-arg OTP_VERSION="${{ matrix.otp }}" \
            --tag "rabbitmq-ci:otp-${{ matrix.otp }}" \
            .

      - name: Run checks
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --hostname rabbitmq-ci \
            --env base_rmq_ref \
            --env current_rmq_ref \
            "rabbitmq-ci:otp-${{ matrix.otp }}" \
            bash -euo pipefail -c '
              make fetch-deps current_rmq_ref="$current_rmq_ref"

              # Fix missing internal_user record in rabbit_common (removed in a later commit)
              python3 -c "
import re, sys
content = open('deps/rabbit_common/include/rabbit.hrl').read()
record = '\n-record(internal_user, {username, password_hash, tags, hashing_algorithm, limits = #{}}).\n'
content = content.replace('-record(permission,', record + '-record(permission,')
open('deps/rabbit_common/include/rabbit.hrl', 'w').write(content)
"

              # Fix invalid deprecated attribute string form (only valid in OTP 23+)
              sed -i "s/-deprecated({is_mixed_versions,1,\"Use is_mixed_versions\/0 instead\"})/-deprecated({is_mixed_versions,1,eventually})/" \
                deps/rabbitmq_ct_helpers/src/rabbit_ct_helpers.erl

              make current_rmq_ref="$current_rmq_ref"
              make check-rabbitmq-components.mk current_rmq_ref="$current_rmq_ref"
              make xref current_rmq_ref="$current_rmq_ref"
              make ct-fast current_rmq_ref="$current_rmq_ref"
            '
